name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure and privacy
        run: python3 tests/validate_structure.py
      - name: Test safe review saving
        run: bash tests/test_save_review.sh
